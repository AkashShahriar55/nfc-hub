name: nfc_hub
description: "A Flutter plugin for reading NFC tags through external CCID/PC-SC readers and the device's built-in NFC antenna."
version: 0.4.0
homepage: https://github.com/cheqplease/nfc_hub

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  dart_pcsc: ^2.0.2
  plugin_platform_interface: ^2.1.8
  platform_detector: ^0.2.0
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.cheqplease.nfchub
        pluginClass: NfcHubPlugin
      ios:
        pluginClass: NfcHubPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: NfcHubPlugin
        sharedDarwinSource: true
      linux:
        pluginClass: NfcHubPlugin
      windows:
        pluginClass: NfcHubPluginCApi
