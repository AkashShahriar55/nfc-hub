name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # Keep in step with .fvmrc: the formatter's output depends on this version.
  FLUTTER_VERSION: '3.38.3'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: flutter test
      - run: flutter test
        working-directory: example/
      - run: flutter pub publish --dry-run

  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    name: example-apk-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --${{ matrix.variant }}
        working-directory: example/
      - uses: actions/upload-artifact@v4
        with:
          name: example-apk-${{ matrix.variant }}
          path: example/build/app/outputs/flutter-apk/app-${{ matrix.variant }}.apk
